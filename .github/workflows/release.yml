name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w -X netspy/cmd.Version=${{ github.ref_name }}" -o netspy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

      # SBOM (CycloneDX) pro Zielplattform - Build-Constraints über GOOS/GOARCH,
      # da sich die eingebundenen Module je Plattform unterscheiden
      - name: Generate SBOM
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          GOOS= GOARCH= go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -licenses -assert-licenses \
            -output netspy-${{ matrix.os }}-${{ matrix.arch }}.cdx.json -main . .

      # Lizenz- und NOTICE-Texte aller Module, die tatsächlich in der Binary stecken
      - name: Collect third-party licenses
        run: |
          out=THIRD_PARTY_LICENSES.txt
          echo "Lizenzen der in netspy-${{ matrix.os }}-${{ matrix.arch }} enthaltenen Fremdpakete" > "$out"
          echo "Übersicht und Datenquellen: https://github.com/feiglein74/netspy/blob/main/THIRD_PARTY.md" >> "$out"
          go version -m netspy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} | awk '$1=="dep"{print $2, $3}' | while read -r mod ver; do
            dir=$(go list -m -f '{{.Dir}}' "$mod")
            printf '\n\n==================================================================\n%s %s\n==================================================================\n' "$mod" "$ver" >> "$out"
            found=0
            for f in "$dir"/LICENSE* "$dir"/LICENCE* "$dir"/COPYING* "$dir"/NOTICE*; do
              [ -f "$f" ] || continue
              printf '\n--- %s ---\n\n' "$(basename "$f")" >> "$out"
              cat "$f" >> "$out"
              found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "FEHLER: Keine Lizenzdatei für $mod gefunden" >&2
              exit 1
            fi
          done

      - name: Create ZIP archive
        run: |
          mkdir -p dist
          cp netspy-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} dist/
          cp vendor_learned.txt LICENSE THIRD_PARTY_LICENSES.txt dist/
          cp netspy-${{ matrix.os }}-${{ matrix.arch }}.cdx.json dist/
          cd dist && zip ../netspy-${{ matrix.os }}-${{ matrix.arch }}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netspy-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            netspy-${{ matrix.os }}-${{ matrix.arch }}.zip
            netspy-${{ matrix.os }}-${{ matrix.arch }}.cdx.json

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          # Verschiebe alle ZIP-Dateien und SBOMs ins Release-Verzeichnis
          find artifacts -type f \( -name "*.zip" -o -name "*.cdx.json" \) -exec mv {} release/ \;
          # Zeige was wir haben
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
